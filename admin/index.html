<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Portfolio Admin</title>
    <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="../assets/css/admin.css" rel="stylesheet" />
  </head>
  <body>
    <main class="admin-shell">
      <section id="loginView" class="login-view">
        <form id="loginForm" class="login-card">
          <span class="eyebrow">Portfolio Admin</span>
          <h1>Sign in</h1>
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" autocomplete="current-password" required />
          <button type="submit" class="admin-button-primary"><i class="bi bi-box-arrow-in-right"></i> Login</button>
          <p id="loginStatus" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="editorView" class="editor-view admin-shell" hidden>
        <aside class="admin-sidebar">
          <div class="admin-sidebar-logo">
            <div class="logo-mark">
              <i class="bi bi-tags"></i>
            </div>
            <div>
              <strong>Portfolio CMS</strong>
              <span>Admin dashboard</span>
            </div>
          </div>
          <div class="admin-sidebar-scroll">
            <nav id="sectionNav" class="admin-sidebar-menu" aria-label="Admin sections"></nav>
          </div>
          <div class="admin-sidebar-footer">
            <a href="/" class="admin-button-secondary"><i class="bi bi-arrow-up-right"></i> View site</a>
          </div>
        </aside>

        <section class="admin-layout">
          <header class="admin-header">
            <div>
              <h2 id="activeTitle" class="admin-header-title">Overview</h2>
              <p class="admin-header-subtitle">Manage website content, links, projects, and contact details.</p>
            </div>
            <div class="admin-header-actions">
              <label class="admin-button-secondary import-button">
                <i class="bi bi-upload"></i>
                Import
                <input id="importFile" type="file" accept="application/json" />
              </label>
              <button id="previewButton" type="button" class="admin-button-secondary"><i class="bi bi-eye"></i> Preview</button>
              <button id="exportButton" type="button" class="admin-button-secondary"><i class="bi bi-download"></i> Export</button>
              <button id="saveButton" type="button" class="admin-button-primary"><i class="bi bi-check2-circle"></i> Save</button>
              <button id="logoutButton" type="button" class="admin-avatar" aria-label="Logout">A</button>
            </div>
          </header>

          <main class="admin-main">
            <div id="editorPanels" class="panels admin-page"></div>
            <p id="editorStatus" class="status" aria-live="polite"></p>
          </main>
        </section>
      </section>
    </main>

    <script src="../assets/js/admin.js"></script>
  </body>
</html>
